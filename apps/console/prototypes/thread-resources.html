<!doctype html>
<!--
  PROTOTYPE — throwaway. Answers: "what should the per-Thread resource/connector
  attach surface look like?" Three structurally different variants, switch with
  the floating bar (or ← / → keys), or ?variant=A|B|C.

  Domain frame:
    - A Thread attaches RESOURCES from CONNECTORS (GitHub, Linear, Jira, Notion, Sentry).
    - GitHub repos are the SPECIAL CASE: attaching one provisions a VM (clone + bash/fs).
    - Everything else is READ-ONLY context the Gateway fetches — no VM.
    - The VM gate is programmatic: "Thread has >=1 repo" -> sandbox.
  Open directly in a browser (file://) — no build step.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tempo — Thread resources (prototype)</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-subtle: #fafafa;
    --bg-sunken: #f4f4f5;
    --text: #1c1d1f;
    --muted: #6b6f76;
    --faint: #9a9ea5;
    --border: #e6e7e9;
    --border-strong: #d8d9dc;
    --accent: #5b5bd6;
    --accent-soft: #eeeefb;
    --vm: #b45309;       /* amber — the "this triggers a sandbox" signal */
    --vm-soft: #fef3c7;
    --vm-border: #f3d79a;
    --ok: #15803d;
    --radius: 9px;
    --shadow: 0 1px 2px rgba(20,20,30,.05), 0 8px 24px rgba(20,20,30,.08);
    font-synthesis: none;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    color: var(--text);
    background: var(--bg-subtle);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .proto-banner {
    background: repeating-linear-gradient(45deg, #fff7ed, #fff7ed 10px, #ffedd5 10px, #ffedd5 20px);
    color: #9a3412; font-size: 11.5px; font-weight: 600; letter-spacing: .03em;
    text-align: center; padding: 4px; border-bottom: 1px solid var(--vm-border);
  }

  /* ---------- shared app chrome ---------- */
  .app { display: flex; height: calc(100% - 25px); }
  .rail {
    width: 220px; flex: none; background: var(--bg-sunken);
    border-right: 1px solid var(--border); padding: 14px 12px; gap: 2px; display: flex; flex-direction: column;
  }
  .rail .logo { font-weight: 700; font-size: 15px; padding: 4px 8px 14px; display:flex; align-items:center; gap:8px;}
  .rail .logo .dot { width: 16px; height: 16px; border-radius: 5px; background: var(--accent); }
  .rail .nav { font-size: 13px; color: var(--muted); padding: 6px 8px; border-radius: 6px; }
  .rail .nav.active { background: #fff; color: var(--text); box-shadow: var(--shadow); }
  .rail .sec { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); padding: 16px 8px 6px; }

  .main { flex: 1; min-width: 0; display: flex; }
  .thread { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
  .thread-head {
    height: 52px; flex: none; border-bottom: 1px solid var(--border); padding: 0 22px;
    display: flex; align-items: center; gap: 10px;
  }
  .thread-head h1 { font-size: 14.5px; font-weight: 600; margin: 0; }
  .thread-head .status { font-size: 12px; color: var(--muted); display:flex; align-items:center; gap:6px; }
  .pill-online { width:7px;height:7px;border-radius:50%; background: var(--ok); box-shadow: 0 0 0 3px #15803d22;}

  .scroll { flex: 1; overflow-y: auto; padding: 22px 22px 8px; }
  .msg { max-width: 680px; margin: 0 auto 20px; display: flex; gap: 11px; }
  .msg .av { width: 26px; height: 26px; border-radius: 7px; flex: none; display:grid; place-items:center; color:#fff; font-size:12px; font-weight:600;}
  .av.dev { background: #3f3f46; }
  .av.agent { background: var(--accent); }
  .msg .body .who { font-weight: 600; font-size: 13px; margin-bottom: 1px; }
  .msg .body p { margin: 2px 0; color: #2c2d31; }
  .msg .body .meta { font-size: 12px; color: var(--faint); }

  /* agent activity / provisioning checklist (mirrors the reference UI) */
  .activity { max-width: 680px; margin: 0 auto 20px; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .activity summary { list-style: none; cursor: pointer; padding: 10px 12px; font-size: 13px; display:flex; align-items:center; gap:8px; background: var(--bg-subtle);}
  .activity summary::-webkit-details-marker { display:none; }
  .activity .steps { padding: 6px 12px 12px; }
  .step { display: flex; align-items: center; gap: 9px; padding: 4px 0; font-size: 13px; }
  .step .ic { width: 16px; height: 16px; flex:none; }
  .step.done { color: var(--text); }
  .step.run { color: var(--text); }
  .step.todo { color: var(--faint); }
  .step .sub { color: var(--faint); font-size: 12.5px; padding-left: 25px; }
  .spin { animation: spin 1s linear infinite; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- composer (shared base) ---------- */
  .composer-wrap { flex: none; padding: 10px 22px 18px; background: linear-gradient(transparent, var(--bg) 30%); }
  .composer { max-width: 680px; margin: 0 auto; border: 1px solid var(--border-strong); border-radius: 14px; background: #fff; box-shadow: var(--shadow); }
  .composer.focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .composer textarea {
    width: 100%; border: 0; outline: 0; resize: none; padding: 13px 15px 4px; font: inherit; color: var(--text);
    background: transparent; min-height: 24px;
  }
  .composer .tools { display: flex; align-items: center; gap: 6px; padding: 6px 10px 9px; }
  .composer .tools .spacer { flex: 1; }
  .iconbtn {
    width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border); background: #fff;
    display: grid; place-items: center; cursor: pointer; color: var(--muted);
  }
  .iconbtn:hover { background: var(--bg-subtle); color: var(--text); }
  .ghostbtn { font-size:12.5px; color: var(--muted); padding: 4px 9px; border-radius: 7px; cursor:pointer; border:1px solid transparent; display:flex; align-items:center; gap:6px;}
  .ghostbtn:hover { background: var(--bg-subtle); }
  .sendbtn { background: var(--accent); color:#fff; border-color: var(--accent); }
  .sendbtn:hover { background: #4a4ac4; color:#fff; }
  .modeltag { font-size:12px; color: var(--muted); padding: 4px 8px; }

  /* chips */
  .chips { display: flex; flex-wrap: wrap; gap: 7px; padding: 11px 12px 2px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 7px 4px 6px; border-radius: 7px;
    background: var(--bg-sunken); border: 1px solid var(--border); font-size: 12.5px; font-weight: 500;
  }
  .chip.vm { background: var(--vm-soft); border-color: var(--vm-border); }
  .chip .ic { width: 15px; height: 15px; border-radius: 4px; display:grid; place-items:center; color:#fff; font-size:9px; font-weight:700; flex:none;}
  .chip .x { cursor: pointer; color: var(--faint); width:14px; height:14px; display:grid; place-items:center; border-radius:4px;}
  .chip .x:hover { background: #0001; color: var(--text); }
  .chip .vmbadge { font-size: 9px; font-weight: 700; color: var(--vm); background:#fff8; border:1px solid var(--vm-border); border-radius: 4px; padding: 0 4px; letter-spacing:.02em;}

  .vm-note {
    max-width: 680px; margin: 8px auto 0; font-size: 12px; color: var(--vm);
    display: flex; align-items: center; gap: 7px;
  }

  /* A: per-message attachments ABOVE the textarea (scoped to this message, like images) */
  .msg-attach { display:flex; flex-wrap:wrap; gap:7px; padding: 11px 12px 2px; }
  .att-chip { display:inline-flex; align-items:center; gap:6px; padding:4px 8px 4px 5px; border-radius:7px; background:#fff; border:1px solid var(--border); font-size:12.5px; box-shadow:var(--shadow); }
  .att-chip .thumb { width:18px;height:18px;border-radius:4px;background:linear-gradient(135deg,#c7d2fe,#a5b4fc);display:grid;place-items:center;color:#fff;font-size:10px;}
  .att-chip .x { cursor:pointer;color:var(--faint);}
  /* A: thread context BELOW the input (applies to the whole thread) */
  .ctx-bar { display:flex; align-items:center; flex-wrap:wrap; gap:8px 9px; padding: 9px 11px; border-top:1px solid var(--border); background:var(--bg-subtle); border-radius:0 0 13px 13px; }
  .ctx-label { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--faint); display:inline-flex; align-items:center; gap:6px; font-weight:600; }
  .ctx-chips { display:flex; flex-wrap:wrap; gap:7px; }
  .ctx-add { margin-left:auto; font-size:12.5px; color:var(--accent); background:#fff; border:1px solid var(--border); border-radius:7px; padding:5px 10px; cursor:pointer; font-weight:500; }
  .ctx-add:hover { background:var(--accent-soft); }

  /* connector tiles (brand letters) */
  .ctile { border-radius: 4px; display: grid; place-items: center; color: #fff; font-weight: 700; }
  .c-github { background: #1f2328; }
  .c-linear { background: #5e6ad2; }
  .c-jira   { background: #1868db; }
  .c-notion { background: #111; }
  .c-sentry { background: #6b2fa0; }

  /* ---------- A: popover menu ---------- */
  .pop {
    position: absolute; z-index: 40; width: 320px; background: #fff; border: 1px solid var(--border);
    border-radius: 12px; box-shadow: var(--shadow); padding: 6px; max-height: 380px; overflow-y: auto;
  }
  .pop .grp { font-size: 11px; text-transform: uppercase; letter-spacing:.05em; color: var(--faint); padding: 8px 9px 4px; display:flex; align-items:center; gap:7px;}
  .pop .opt { display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: 8px; cursor: pointer; }
  .pop .opt:hover { background: var(--bg-subtle); }
  .pop .opt .ic { width: 20px; height: 20px; flex:none; }
  .pop .opt .t { flex: 1; min-width:0; }
  .pop .opt .t .ttl { font-size: 13px; font-weight: 500; }
  .pop .opt .t .sb { font-size: 12px; color: var(--faint); }
  .pop .opt .ck { width: 16px; height: 16px; border:1.5px solid var(--border-strong); border-radius: 5px; flex:none;}
  .pop .opt.sel .ck { background: var(--accent); border-color: var(--accent); }
  .pop .opt.sel .ck svg { color:#fff; }
  .pop .vmtag { font-size:9px; font-weight:700; color: var(--vm); background: var(--vm-soft); border:1px solid var(--vm-border); padding:1px 5px; border-radius:4px;}

  /* ---------- B: context rail ---------- */
  .ctx {
    width: 312px; flex: none; border-left: 1px solid var(--border); background: var(--bg-subtle);
    display: flex; flex-direction: column;
  }
  .ctx-head { padding: 14px 16px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border);}
  .ctx-head .t { font-weight: 600; font-size: 13px; }
  .ctx-body { overflow-y: auto; padding: 12px 12px 24px; flex:1; }
  .ctx-card { background:#fff; border:1px solid var(--border); border-radius: 11px; margin-bottom: 12px; overflow:hidden; }
  .ctx-card.vm { border-color: var(--vm-border); }
  .ctx-card .ch { padding: 11px 13px; display:flex; align-items:center; gap:8px; font-weight:600; font-size:12.5px; border-bottom:1px solid var(--border);}
  .ctx-card.vm .ch { background: var(--vm-soft); color: var(--vm); border-color: var(--vm-border);}
  .ctx-grp-title { font-size: 11px; text-transform: uppercase; letter-spacing:.05em; color: var(--faint); padding: 4px 4px 7px; display:flex; align-items:center; gap:7px;}
  .res { display:flex; align-items:center; gap:9px; padding: 8px; border-radius: 9px; }
  .res:hover { background: #fff; box-shadow: var(--shadow); }
  .res .ic { width: 22px; height:22px; flex:none; }
  .res .t { flex:1; min-width:0;}
  .res .t .ttl { font-size: 13px; font-weight: 500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .res .t .sb { font-size: 12px; color: var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .res .rm { opacity: 0; cursor:pointer; color: var(--faint); }
  .res:hover .rm { opacity: 1; }
  .addctx { width:100%; border:1px dashed var(--border-strong); background:#fff; border-radius:9px; padding:9px; font:inherit; color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:7px;}
  .addctx:hover { border-color: var(--accent); color: var(--accent); }

  /* modal for B */
  .scrim { position: fixed; inset:0; background: #1c1d1f33; z-index: 60; display:grid; place-items:center; }
  .modal { width: 460px; max-height: 70vh; background:#fff; border-radius: 14px; box-shadow: var(--shadow); display:flex; flex-direction:column; overflow:hidden;}
  .modal .mh { padding: 14px 16px; border-bottom: 1px solid var(--border); font-weight:600; display:flex; align-items:center; justify-content:space-between;}
  .modal .ms { padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .modal .ms input { width:100%; border:1px solid var(--border); border-radius: 8px; padding: 8px 10px; font:inherit; outline:none;}
  .modal .ml { overflow-y:auto; padding: 8px; }
  .modal .mf { padding: 11px 14px; border-top: 1px solid var(--border); display:flex; justify-content:flex-end; gap:8px;}
  .btn { padding: 7px 13px; border-radius: 8px; border:1px solid var(--border-strong); background:#fff; font:inherit; cursor:pointer; font-weight:500;}
  .btn.primary { background: var(--accent); color:#fff; border-color: var(--accent);}

  /* ---------- C: @-mention palette ---------- */
  .inline-box { display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding: 12px 15px 6px; }
  .inline-box .token {
    display:inline-flex; align-items:center; gap:5px; padding:2px 7px; border-radius:6px; font-size:12.5px; font-weight:600;
    background: var(--accent-soft); color: var(--accent); border:1px solid #dadafc;
  }
  .inline-box .token.vm { background: var(--vm-soft); color: var(--vm); border-color: var(--vm-border);}
  .inline-box .token .x { cursor:pointer; opacity:.6;}
  .inline-box .ed { flex:1; min-width: 120px; border:0; outline:0; font:inherit; padding:2px 0; }
  .palette {
    position:absolute; z-index:40; width: 360px; background:#fff; border:1px solid var(--border); border-radius:12px;
    box-shadow: var(--shadow); overflow:hidden; max-height: 340px; display:flex; flex-direction:column;
  }
  .palette .ph { padding: 8px 11px; font-size:12px; color: var(--faint); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:7px;}
  .palette .pl { overflow-y:auto; padding: 5px; }
  .palette .grp { font-size: 11px; text-transform: uppercase; letter-spacing:.05em; color: var(--faint); padding: 7px 8px 3px; }
  .palette .opt { display:flex; align-items:center; gap:9px; padding:7px 8px; border-radius:8px; cursor:pointer;}
  .palette .opt.active, .palette .opt:hover { background: var(--accent-soft); }
  .palette .opt .ic { width:18px;height:18px;flex:none;}
  .palette .opt .t{flex:1;min-width:0;}
  .palette .opt .ttl{font-size:13px;font-weight:500;}
  .palette .opt .sb{font-size:12px;color:var(--faint);}
  .palette .opt .vmtag{ font-size:9px; font-weight:700; color: var(--vm); background: var(--vm-soft); border:1px solid var(--vm-border); padding:1px 5px; border-radius:4px;}
  .src-status { max-width:680px; margin: 8px auto 0; display:flex; align-items:center; gap:10px; font-size:12px; color: var(--muted);}
  .src-status .bar { flex:1; height:4px; border-radius:3px; background: var(--bg-sunken); overflow:hidden; }
  .src-status .bar i { display:block; height:100%; background: var(--vm); width:66%; }

  /* ---------- state readout (prototype rule: surface the state) ---------- */
  .readout {
    position: fixed; top: 31px; right: 12px; z-index: 50; background:#1c1d1f; color:#fff; border-radius:9px;
    padding: 8px 11px; font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; max-width: 250px;
    box-shadow: var(--shadow); opacity:.92;
  }
  .readout b { color:#fbbf24; }
  .readout .vmon { color:#fbbf24; } .readout .vmoff { color:#86efac; }

  /* ---------- floating variant switcher ---------- */
  .switcher {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 80;
    display:flex; align-items:center; gap:4px; background:#1c1d1f; color:#fff; border-radius: 999px;
    padding: 5px 6px; box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }
  .switcher button { width: 30px; height: 30px; border:0; background:#ffffff14; color:#fff; border-radius:999px; cursor:pointer; font-size:15px;}
  .switcher button:hover { background:#ffffff28; }
  .switcher .lbl { font-size: 12.5px; font-weight: 600; padding: 0 12px; min-width: 200px; text-align:center; }
  .switcher .lbl small { color:#a1a1aa; font-weight:500; }
</style>
</head>
<body>
  <div class="proto-banner">PROTOTYPE · throwaway · per-Thread resources / universal connector · ← → to switch designs</div>
  <div id="root"></div>
  <div class="switcher" id="switcher"></div>

<script>
/* ----------------------------- mock data ----------------------------- */
const CONNECTORS = [
  { id:'github', name:'GitHub', cls:'c-github', glyph:gh(), vm:true,
    label:'Repository', resources:[
      { id:'acme/api',   ttl:'acme/api',   sb:'main · TypeScript' },
      { id:'acme/web',   ttl:'acme/web',   sb:'main · Next.js' },
      { id:'acme/infra', ttl:'acme/infra', sb:'main · Terraform' },
    ]},
  { id:'linear', name:'Linear', cls:'c-linear', glyph:'L', vm:false,
    label:'Issue', resources:[
      { id:'ENG-1234', ttl:'ENG-1234', sb:'Rework auth flow' },
      { id:'ENG-1240', ttl:'ENG-1240', sb:'SSO for enterprise' },
    ]},
  { id:'jira', name:'Jira', cls:'c-jira', glyph:'J', vm:false,
    label:'Issue', resources:[
      { id:'PLAT-88', ttl:'PLAT-88', sb:'Migrate billing webhooks' },
    ]},
  { id:'notion', name:'Notion', cls:'c-notion', glyph:'N', vm:false,
    label:'Page', resources:[
      { id:'notion:deploy', ttl:'Deploy runbook', sb:'Engineering / Ops' },
      { id:'notion:arch',   ttl:'Q3 Architecture', sb:'Planning' },
    ]},
  { id:'sentry', name:'Sentry', cls:'c-sentry', glyph:'S', vm:false,
    label:'Issue', resources:[
      { id:'sentry:auth-500', ttl:'AuthError 500 spike', sb:'prod · 1.2k events' },
    ]},
];
function gh(){ return '<svg viewBox="0 0 16 16" width="11" height="11" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>'; }
function checkSvg(s){ return '<svg viewBox="0 0 16 16" width="'+(s||16)+'" height="'+(s||16)+'" fill="none" stroke="currentColor" stroke-width="2"><path d="M3.5 8.5l3 3 6-7"/></svg>'; }
function circleCheck(){ return '<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="#15803d" stroke-width="1.6"><circle cx="8" cy="8" r="6.5"/><path d="M5 8l2 2 4-4.5"/></svg>'; }
function spinSvg(){ return '<svg class="spin" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="#5b5bd6" stroke-width="1.8"><path d="M8 1.5a6.5 6.5 0 1 1-6 4" stroke-linecap="round"/></svg>'; }
function blockSvg(){ return '<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="#9a9ea5" stroke-width="1.4"><circle cx="8" cy="8" r="6.5"/><path d="M3.7 3.7l8.6 8.6"/></svg>'; }

const con = id => CONNECTORS.find(c => c.id === id);
const res = (cid, rid) => con(cid).resources.find(r => r.id === rid);

/* ----------------------------- state ----------------------------- */
// attached resources, pre-seed with one read-only source so the empty state isn't the only thing on show
let attached = [ { cid:'notion', rid:'notion:deploy' } ];
const isAttached = (cid, rid) => attached.some(a => a.cid===cid && a.rid===rid);
const vmNeeded = () => attached.some(a => con(a.cid).vm);
function toggle(cid, rid){
  const i = attached.findIndex(a => a.cid===cid && a.rid===rid);
  if (i>=0) attached.splice(i,1); else attached.push({cid,rid});
  render();
}
function tile(cid, size){ const c=con(cid); const s=size||20;
  return '<span class="ctile '+c.cls+'" style="width:'+s+'px;height:'+s+'px;font-size:'+(s*0.5)+'px">'+c.glyph+'</span>'; }

/* provisioning checklist (shared) — 3 coarse steps, Tempo vocabulary (no "session"/"Claude Code") */
function checklist(compact){
  if (!vmNeeded()) return '';
  const repos = attached.filter(a=>con(a.cid).vm).map(a=>res(a.cid,a.rid).ttl).join(', ');
  return `
  <details class="activity" open>
    <summary>${spinSvg()} <span>Provisioning sandbox…</span> <span style="color:var(--faint)">${repos}</span></summary>
    <div class="steps">
      <div class="step done">${circleCheck()}<span>Set up sandbox</span></div>
      <div class="step done">${circleCheck()}<span>Cloned repositories</span> <span style="color:var(--faint);font-size:12px">${repos}</span></div>
      <div class="step run">${spinSvg()}<span>Agent started</span></div>
      ${compact?'':'<div class="step sub">Tempo runs the planning Agent inside the sandbox with your repo mounted.</div>'}
    </div>
  </details>`;
}

/* ----------------------------- shared chrome ----------------------------- */
function chrome(centerHTML, rightHTML){
  return `
  <div class="app">
    <aside class="rail">
      <div class="logo"><span class="dot"></span> Tempo</div>
      <div class="nav">Inbox</div>
      <div class="nav active">Threads</div>
      <div class="nav">Spaces</div>
      <div class="sec">Recent</div>
      <div class="nav">Rework auth flow</div>
      <div class="nav">Billing webhooks</div>
    </aside>
    <div class="main">
      <div class="thread">
        <div class="thread-head">
          <h1>Plan: migrate auth to org-scoped sessions</h1>
          <div class="status"><span class="pill-online"></span> Hosted agent</div>
        </div>
        ${centerHTML}
      </div>
      ${rightHTML||''}
    </div>
  </div>`;
}
function discussion(){
  return `
  <div class="scroll" id="scroll">
    <div class="msg"><div class="av dev">D</div><div class="body">
      <div class="who">You</div>
      <p>We need to move auth to org-scoped sessions. Let's plan it before I touch code.</p>
    </div></div>
    <div class="msg"><div class="av agent">T</div><div class="body">
      <div class="who">Agent</div>
      <p>Happy to. Is this a pure design discussion, or should I plan against a specific codebase? If so, attach the repo and I'll work inside a sandbox.</p>
      <div class="meta">just now</div>
    </div></div>
    ${vmNeeded() ? `<div class="msg"><div class="av agent">T</div><div class="body"><div class="who">Agent</div>${checklist(false)}</div></div>`:''}
  </div>`;
}

/* ============================================================
   VARIANT A — composer + unified "+" menu, chips above textarea
   ============================================================ */
let aOpen = false;
const ctxIcon = '<svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 1.8 14 5l-6 3.2L2 5l6-3.2Z"/><path d="M2 8l6 3.2L14 8M2 11l6 3.2L14 11"/></svg>';
function VariantA(){
  const chips = attached.length ? attached.map(a=>{
    const c=con(a.cid), r=res(a.cid,a.rid);
    return `<span class="chip ${c.vm?'vm':''}">${tile(a.cid,15)}<span>${r.ttl}</span>${c.vm?'<span class="vmbadge">SANDBOX</span>':''}<span class="x" data-x="${a.cid}|${a.rid}">×</span></span>`;
  }).join('') : '<span style="color:var(--faint);font-size:12.5px">No repos or sources yet</span>';

  const note = vmNeeded() ? `<div class="vm-note">⚡ A repo is attached — a sandbox starts on your next message.</div>`:'';

  return chrome(`
    ${discussion()}
    <div class="composer-wrap">
      ${note}
      <div class="composer" id="cmpA">
        <!-- ABOVE the input: attachments scoped to THIS message (e.g. an image) -->
        <div class="msg-attach">
          <span class="att-chip"><span class="thumb">▦</span> error-screenshot.png <span class="x">×</span></span>
        </div>
        <textarea placeholder="Describe the task or ask a question…" rows="1"></textarea>
        <div class="tools">
          <button class="iconbtn" title="Attach image to this message">📎</button>
          <span class="ghostbtn">Auto ▾</span>
          <div class="spacer"></div>
          <span class="modeltag">Opus 4.8</span>
          <button class="iconbtn sendbtn" title="Send">↵</button>
        </div>
        <!-- BELOW the input: context that applies to the WHOLE thread -->
        <div class="ctx-bar">
          <span class="ctx-label">${ctxIcon} Thread context</span>
          <div class="ctx-chips">${chips}</div>
          <button class="ctx-add" id="aPlus">+ Add repo or source</button>
        </div>
      </div>
    </div>
    ${aOpen?popA():''}
  `);
}
function popA(){
  return `<div class="pop" id="popA" style="left:0;top:0">
    ${CONNECTORS.map(c=>`
      <div class="grp">${tile(c.id,14)} ${c.name} ${c.vm?'<span class="vmtag">needs sandbox</span>':''}</div>
      ${c.resources.map(r=>{
        const sel=isAttached(c.id,r.id);
        return `<div class="opt ${sel?'sel':''}" data-pick="${c.id}|${r.id}">
          ${tile(c.id,20)}
          <div class="t"><div class="ttl">${r.ttl}</div><div class="sb">${r.sb}</div></div>
          <span class="ck">${sel?checkSvg(12):''}</span>
        </div>`;
      }).join('')}
    `).join('')}
  </div>`;
}

/* ============================================================
   VARIANT B — persistent right "Context" rail + add modal
   ============================================================ */
let bModal = false, bSearch = '';
function VariantB(){
  // group attached by connector
  const groups = CONNECTORS.map(c => ({ c, items: attached.filter(a=>a.cid===c.id).map(a=>res(c.id,a.rid)) }))
                           .filter(g => g.items.length);
  const sandboxCard = vmNeeded() ? `
    <div class="ctx-card vm">
      <div class="ch">${spinSvg()} Sandbox</div>
      <div style="padding:8px 12px 12px">
        <div class="step done">${circleCheck()}<span>Set up sandbox</span></div>
        <div class="step done">${circleCheck()}<span>Cloned repositories</span></div>
        <div class="step run">${spinSvg()}<span>Agent started</span></div>
        <div style="font-size:12px;color:var(--faint);padding-top:6px">Mounted: ${attached.filter(a=>con(a.cid).vm).map(a=>res(a.cid,a.rid).ttl).join(', ')}</div>
      </div>
    </div>`:'';

  const list = groups.length ? groups.map(g=>`
    <div class="ctx-grp-title">${tile(g.c.id,14)} ${g.c.name} ${g.c.vm?'<span class="vmtag" style="font-size:9px;color:var(--vm)">SANDBOX</span>':''}</div>
    ${g.items.map(r=>`<div class="res">${tile(g.c.id,22)}
      <div class="t"><div class="ttl">${r.ttl}</div><div class="sb">${r.sb}</div></div>
      <span class="rm" data-x="${g.c.id}|${r.id}">×</span></div>`).join('')}
  `).join('') : `<div style="color:var(--faint);font-size:13px;text-align:center;padding:18px 0">No context attached yet.</div>`;

  const right = `
  <aside class="ctx">
    <div class="ctx-head"><span class="t">Context</span><span style="font-size:12px;color:var(--faint)">${attached.length}</span></div>
    <div class="ctx-body">
      ${sandboxCard}
      <div class="ctx-card"><div style="padding:10px">${list}
        <div style="height:8px"></div>
        <button class="addctx" id="bAdd">+ Add context</button>
      </div></div>
    </div>
  </aside>`;

  const center = `
    ${discussion()}
    <div class="composer-wrap">
      <div class="composer">
        <textarea placeholder="Describe the task or ask a question…" rows="1"></textarea>
        <div class="tools">
          <span class="ghostbtn" id="bAdd2">⊕ Context</span>
          <span class="ghostbtn">Auto ▾</span>
          <div class="spacer"></div>
          <span class="modeltag">Opus 4.8</span>
          <button class="iconbtn sendbtn">↵</button>
        </div>
      </div>
    </div>`;

  return chrome(center, right) + (bModal?modalB():'');
}
function modalB(){
  const q = bSearch.toLowerCase();
  return `<div class="scrim" id="scrimB"><div class="modal" onclick="event.stopPropagation()">
    <div class="mh"><span>Add context to this thread</span><span class="x" id="bClose" style="cursor:pointer;color:var(--faint)">×</span></div>
    <div class="ms"><input id="bInput" placeholder="Search repos, issues, pages…" value="${bSearch}" autofocus></div>
    <div class="ml">
      ${CONNECTORS.map(c=>{
        const items = c.resources.filter(r => (r.ttl+' '+r.sb).toLowerCase().includes(q));
        if(!items.length) return '';
        return `<div class="ctx-grp-title">${tile(c.id,14)} ${c.name} ${c.vm?'<span style="font-size:9px;color:var(--vm)">· sandbox</span>':''}</div>
        ${items.map(r=>{const sel=isAttached(c.id,r.id);
          return `<div class="opt" data-pick="${c.id}|${r.id}" style="display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;cursor:pointer">
            ${tile(c.id,20)}<div class="t" style="flex:1"><div class="ttl" style="font-size:13px;font-weight:500">${r.ttl}</div><div class="sb" style="font-size:12px;color:var(--faint)">${r.sb}</div></div>
            <span class="ck" style="width:16px;height:16px;border:1.5px solid var(--border-strong);border-radius:5px;${sel?'background:var(--accent);border-color:var(--accent)':''};display:grid;place-items:center;color:#fff">${sel?checkSvg(12):''}</span>
          </div>`;}).join('')}`;
      }).join('')}
    </div>
    <div class="mf"><button class="btn" id="bDone2">Cancel</button><button class="btn primary" id="bDone">Done</button></div>
  </div></div>`;
}

/* ============================================================
   VARIANT C — inline @-mention tokens + command palette
   ============================================================ */
let cOpen = false, cQuery = '', cActive = 0;
function VariantC(){
  const tokens = attached.map(a=>{
    const c=con(a.cid), r=res(a.cid,a.rid);
    return `<span class="token ${c.vm?'vm':''}">${tile(a.cid,13)} ${r.ttl} <span class="x" data-x="${a.cid}|${a.rid}">×</span></span>`;
  }).join('');

  const status = vmNeeded() ? `
    <div class="src-status">
      <span style="color:var(--vm);font-weight:600">⚡ Sandbox</span>
      <span>cloning ${attached.filter(a=>con(a.cid).vm).map(a=>res(a.cid,a.rid).ttl).join(', ')}…</span>
      <span class="bar"><i></i></span>
    </div>` :
    `<div class="src-status"><span>Type <b style="color:var(--text)">@</b> to add a repo, issue, or page as context.</span></div>`;

  return chrome(`
    ${discussion()}
    <div class="composer-wrap">
      ${status}
      <div class="composer" id="cmpC" style="margin-top:8px">
        <div class="inline-box" id="cBox">
          ${tokens}
          <input class="ed" id="cEd" placeholder="${attached.length?'':'Describe the task, or @ to add a source…'}">
        </div>
        <div class="tools">
          <span class="ghostbtn" id="cAt">@ Add source</span>
          <div class="spacer"></div>
          <span class="modeltag">Opus 4.8</span>
          <button class="iconbtn sendbtn">↵</button>
        </div>
      </div>
      ${cOpen?paletteC():''}
    </div>
  `);
}
function flatResources(){
  const q = cQuery.toLowerCase();
  const out=[];
  CONNECTORS.forEach(c=>c.resources.forEach(r=>{
    if((c.name+' '+r.ttl+' '+r.sb).toLowerCase().includes(q)) out.push({c,r});
  }));
  return out;
}
function paletteC(){
  const items = flatResources();
  let idx=-1;
  const body = CONNECTORS.map(c=>{
    const rs = items.filter(i=>i.c.id===c.id);
    if(!rs.length) return '';
    return `<div class="grp">${c.name}${c.vm?' · sandbox':''}</div>` + rs.map(i=>{
      idx++; const sel=isAttached(c.id,i.r.id); const active = idx===cActive;
      return `<div class="opt ${active?'active':''}" data-pick="${c.id}|${i.r.id}">
        ${tile(c.id,18)}<div class="t"><div class="ttl">${i.r.ttl}</div><div class="sb">${i.r.sb}</div></div>
        ${i.c.vm?'<span class="vmtag">sandbox</span>':''}
        ${sel?'<span style="color:var(--accent)">'+checkSvg(14)+'</span>':''}
      </div>`;
    }).join('');
  }).join('');
  return `<div class="palette" id="paletteC" style="left:0;bottom:96px">
    <div class="ph">${cQuery?('@'+cQuery):'Add a source'} — ↑↓ to move, ↵ to attach</div>
    <div class="pl">${body||'<div style="padding:14px;color:var(--faint);font-size:13px">No matches</div>'}</div>
  </div>`;
}

/* ----------------------------- render + wiring ----------------------------- */
const VARIANTS = {
  A: { name:'Composer + “+” menu', fn:VariantA },
  B: { name:'Context side-rail', fn:VariantB },
  C: { name:'@-mention palette', fn:VariantC },
};
function currentVariant(){
  const v = new URLSearchParams(location.search).get('variant');
  return VARIANTS[v] ? v : 'A';
}
function render(){
  const v = currentVariant();
  document.getElementById('root').innerHTML = VARIANTS[v].fn();
  renderReadout(v);
  renderSwitcher(v);
  wire(v);
}
function renderReadout(v){
  let el = document.getElementById('readout');
  if(!el){ el=document.createElement('div'); el.id='readout'; el.className='readout'; document.body.appendChild(el); }
  el.innerHTML = `variant <b>${v}</b> · ${attached.length} source(s)<br>`+
    attached.map(a=>'· '+a.cid+':'+a.rid).join('<br>')+
    `<br>VM gate: <span class="${vmNeeded()?'vmon':'vmoff'}">${vmNeeded()?'PROVISION ▲':'no VM (Worker)'}</span>`;
}
function renderSwitcher(v){
  const keys = Object.keys(VARIANTS);
  document.getElementById('switcher').innerHTML =
    `<button data-step="-1">‹</button>
     <div class="lbl">${v} — ${VARIANTS[v].name}<br><small>?variant=${v}</small></div>
     <button data-step="1">›</button>`;
}
function go(step){
  const keys=Object.keys(VARIANTS); let i=keys.indexOf(currentVariant());
  i=(i+step+keys.length)%keys.length;
  const u=new URL(location); u.searchParams.set('variant',keys[i]); history.replaceState(null,'',u); render();
}

function wire(v){
  document.querySelectorAll('#switcher [data-step]').forEach(b=>b.onclick=()=>go(+b.dataset.step));
  // textarea autosize + focus ring
  document.querySelectorAll('.composer textarea').forEach(t=>{
    t.addEventListener('input',()=>{ t.style.height='auto'; t.style.height=t.scrollHeight+'px'; });
    t.addEventListener('focus',()=>t.closest('.composer')?.classList.add('focus'));
    t.addEventListener('blur',()=>t.closest('.composer')?.classList.remove('focus'));
  });
  // remove chips/tokens/rows
  document.querySelectorAll('[data-x]').forEach(x=>x.onclick=e=>{e.stopPropagation();const [c,r]=x.dataset.x.split('|');toggle(c,r);});

  if(v==='A'){
    const plus=document.getElementById('aPlus');
    if(plus) plus.onclick=e=>{e.stopPropagation(); aOpen=!aOpen; render(); positionA();};
    positionA();
    document.querySelectorAll('#popA [data-pick]').forEach(o=>o.onclick=()=>{const[c,r]=o.dataset.pick.split('|');toggle(c,r);aOpen=true;setTimeout(positionA);});
    document.addEventListener('click',closeA);
  }
  if(v==='B'){
    const open=()=>{bModal=true;render();};
    document.getElementById('bAdd') && (document.getElementById('bAdd').onclick=open);
    document.getElementById('bAdd2') && (document.getElementById('bAdd2').onclick=open);
    if(bModal){
      document.getElementById('bClose').onclick=()=>{bModal=false;render();};
      document.getElementById('bDone').onclick=()=>{bModal=false;render();};
      document.getElementById('bDone2').onclick=()=>{bModal=false;render();};
      document.getElementById('scrimB').onclick=()=>{bModal=false;render();};
      const inp=document.getElementById('bInput'); inp.oninput=()=>{bSearch=inp.value; const pos=inp.selectionStart; render(); const ni=document.getElementById('bInput'); ni.focus(); ni.setSelectionRange(pos,pos);};
      document.querySelectorAll('#scrimB [data-pick]').forEach(o=>o.onclick=()=>{const[c,r]=o.dataset.pick.split('|');toggle(c,r);bModal=true;render();});
    }
  }
  if(v==='C'){
    const openP=()=>{cOpen=true;cActive=0;render();const e=document.getElementById('cEd');e&&e.focus();};
    document.getElementById('cAt') && (document.getElementById('cAt').onclick=openP);
    const ed=document.getElementById('cEd');
    if(ed){
      ed.focus();
      ed.oninput=()=>{ const val=ed.value;
        if(val.startsWith('@')){ cOpen=true; cQuery=val.slice(1); cActive=0; const v=val; render(); const n=document.getElementById('cEd'); n.value=v; n.focus(); }
        else if(cOpen && !val.startsWith('@')){ /* keep typing message */ }
      };
      ed.onkeydown=e=>{
        if(!cOpen) return;
        const items=flatResources();
        if(e.key==='ArrowDown'){e.preventDefault();cActive=Math.min(cActive+1,items.length-1);render();document.getElementById('cEd').focus();}
        if(e.key==='ArrowUp'){e.preventDefault();cActive=Math.max(cActive-1,0);render();document.getElementById('cEd').focus();}
        if(e.key==='Enter' && items[cActive]){e.preventDefault();const it=items[cActive];toggle(it.c.id,it.r.id);cOpen=false;cQuery='';}
        if(e.key==='Escape'){cOpen=false;cQuery='';render();}
      };
    }
    document.querySelectorAll('#paletteC [data-pick]').forEach(o=>o.onclick=()=>{const[c,r]=o.dataset.pick.split('|');toggle(c,r);cOpen=false;cQuery='';});
  }
}
function positionA(){
  const pop=document.getElementById('popA'), btn=document.getElementById('aPlus');
  if(!pop||!btn) return;
  const r=btn.getBoundingClientRect();
  pop.style.left=r.left+'px';
  pop.style.top=(r.top-pop.offsetHeight-8)+'px';
}
function closeA(e){
  if(!aOpen) return;
  if(e.target.closest('#popA')||e.target.closest('#aPlus')) return;
  aOpen=false; document.removeEventListener('click',closeA); render();
}

// global keyboard variant switch (ignore when typing)
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable)) return;
  if(e.key==='ArrowLeft') go(-1);
  if(e.key==='ArrowRight') go(1);
});

render();
</script>
