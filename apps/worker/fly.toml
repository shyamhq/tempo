app = "tempo-worker"
primary_region = "iad"

# Custom domain: worker.tempo.dev → tempo-worker.fly.dev (CNAME at Cloudflare).
# TLS cert: `fly certs create worker.tempo.dev` (Dev manual step after deploy).

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3001"
  NODE_ENV = "production"
  WORKER_LOG_LEVEL = "info"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  # Long-poll connections hold up to 30 s; Fly's idle timeout must exceed that.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "10s"
    grace_period = "5s"
    method = "GET"
    path = "/health"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
