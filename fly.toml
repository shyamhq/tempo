app = "tempo-console"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_URL = "file:/data/tempo.db"
  NODE_ENV = "production"
  CONSOLE_URL = "https://tempo-console.fly.dev"

[[mounts]]
  source = "tempo_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
